textarea,select,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;outline:none}
textarea{min-height:90px;resize:vertical}
textarea:focus,select:focus,input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,166,166,.18)}

.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin:0;box-shadow:none}
.btn.alt{background:var(--soft);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:13px}
.ok{color:var(--teal-t);font-weight:700}
.warn{color:#b8860b;font-weight:700}
.status{background:rgba(0,166,166,.12);border:1px solid rgba(0,166,166,.35);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;margin-bottom:12px;text-align:center}
.badge{background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.badge.red{background:#d33;color:#fff}.badge.tl{background:var(--teal);color:#fff}
.nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -4px 16px rgba(11,31,58,.08)}
.nav button{flex:1;max-width:190px;border:0;background:none;color:var(--mut);font:inherit;font-weight:700;font-size:14px;padding:8px 4px;border-radius:12px;cursor:pointer}
.nav button.on{color:var(--tx);background:rgba(212,175,55,.22);box-shadow:inset 0 -3px 0 var(--gold)}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pc{cursor:pointer}
.pc h3{margin:0 0 4px;font-size:16px}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;border:1px solid var(--gold);padding:10px 18px;border-radius:12px;font-weight:700;z-index:9;font-size:14px;max-width:90vw;text-align:center}
ol.steps{margin:0;padding-inline-start:22px}
ol.steps li{margin-bottom:6px}
.ck{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd);cursor:pointer}
.ck input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal)}
.ck.done span{text-decoration:line-through;color:var(--mut)}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0;transition:.3s}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:right}
th{background:var(--navy);color:var(--gold)}
.hero{background:linear-gradient(135deg,rgba(212,175,55,.15),rgba(0,166,166,.12));border:1px solid var(--gold);border-radius:18px;padding:14px;margin-bottom:12px;font-weight:700}

function normalizeProc(row, idx=0){
  const docsArr = Array.isArray(row.docs) ? row.docs : (Array.isArray(row.d) ? row.d : []);
  const stepsArr = Array.isArray(row.steps) ? row.steps : (Array.isArray(row.s) ? row.s : []);
  return {
    id: row.id ?? ('p-' + idx),
    t: row.title ?? row.t ?? 'معاملة بدون عنوان',
    c: row.category ?? row.c ?? 'عام',
    city: row.city ?? 'كل ليبيا',
    d: docsArr,
    s: stepsArr,
    f: row.fees ?? row.f ?? 'تحقق ميدانياً',
    o: row.office ?? row.o ?? 'الجهة المختصة',
    ph: row.phone ?? row.ph ?? '',
    m: row.map_link ?? row.m ?? '',
    verified: Boolean(row.verified ?? row.v ?? false),
    verified_at: row.verified_at ?? null,
    helpful: Number(row.helpful ?? 0)
  };
}

const $=s=>document.querySelector(s);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>(s??'').toString().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
const store={get(k,d){try{const v=localStorage.getItem('waraqna_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){localStorage.setItem('waraqna_'+k,JSON.stringify(v))}};
let toastT;function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}
function setStatus(m){$('#status').textContent=m}

let sb=null,DATA=[],ready=false,curCat='الكل',curQ='',curCity=store.get('city','كل ليبيا');

async function boot(){
  try{
    if(SB_URL&&SB_KEY&&window.supabase){
      try{
        const cleanUrl=SB_URL.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,'');
        sb=window.supabase.createClient(cleanUrl,SB_KEY.trim());
        const {data,error}=await sb.from('procedures').select('*').order('category',{ascending:true}).order('title',{ascending:true});
        if(error)throw error;
        if(data&&data.length){
          DATA=data.map((r,i)=>normalizeProc(r,i));
          setStatus('✅ متصل بقاعدة البيانات');
        }else{
          DATA=SEED.map((x,i)=>normalizeProc(x,i));
          setStatus('⚠️ قاعدة البيانات فاضية — افتح #admin واضغط "تحميل البيانات الأولية"');
        }
      }catch(e){
        console.warn('Supabase boot error:',e);
        sb=null;
        DATA=SEED.map((x,i)=>normalizeProc(x,i));
        setStatus('⚠️ تعذّر الاتصال بقاعدة البيانات — وضع تجريبي (بيانات محلية)');
      }
    }else{
      DATA=SEED.map((x,i)=>normalizeProc(x,i));
      setStatus('⚠️ وضع تجريبي — أضف مفاتيح Supabase في الكود لتفعيل قاعدة البيانات');
    }
  }catch(fatalErr){
    console.error('Fatal boot error:',fatalErr);
    DATA=SEED.map((x,i)=>normalizeProc(x,i));
    setStatus('⚠️ وضع تجريبي (بيانات محلية)');
  }
  ready=true;
  route();
}
function go(h){location.hash=h}
window.addEventListener('hashchange',route);

function route(){
  if(!ready)return;
  try{
    const h=location.hash||'#/';
    document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));
    if(h.startsWith('#/p/'))viewDetail(decodeURIComponent(h.slice(4)));
    else if(h==='#/suggest'){$('#n-sugg').classList.add('on');viewSuggest()}
    else if(h==='#/about'){$('#n-about').classList.add('on');viewAbout()}
    else if(h==='#admin')viewAdmin();
    else{$('#n-home').classList.add('on');viewHome()}
    window.scrollTo(0,0);
  }catch(err){
    console.error('Route error:',err);
    $('#n-home').classList.add('on');
    viewHome();
  }
}

    <div class="row" style="margin-top:10px">
      <a class="btn sm alt" href="${esc(p.m||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((p.o||'')+' '+p.city))}" target="_blank" rel="noopener">📍 الموقع على الخريطة</a>

    </div>
  </div>
  <div class="row">
    <button class="btn sm alt" onclick="vote('${esc(String(id))}')">👍 المعلومة مفيدة (${p.helpful||0})</button>
    <a class="btn sm alt" href="#/suggest" style="text-decoration:none;text-align:center">💬 اقترح تصحيحاً</a>
  </div>`;
  updCk(id);
}
function togCk(id,i,v){
  const all=store.get('ck',{});all[id]=all[id]||[];all[id][i]=v;store.set('ck',all);
  viewDetail(id);
}
function updCk(id){
  const p=DATA.find(x=>String(x.id)===String(id));if(!p)return;
  const c=(store.get('ck',{})[id]||[]).filter(Boolean).length,n=(p.d||[]).length||1;
  const e=$('#ckp');if(e)e.style.width=Math.round(c/n*100)+'%';
  const t=$('#ckc');if(t)t.textContent=`(${c}/${(p.d||[]).length})`;
}
async function vote(id){
  const voted=store.get('votes',[]);
  if(voted.includes(id)){toast('سجّلنا تقييمك من قبل 🙏');return}
  const p=DATA.find(x=>String(x.id)===String(id));if(!p)return;
  p.helpful=(p.helpful||0)+1;
  if(sb){
    try{
      const {data}=await sb.from('procedures').select('helpful').eq('id',p.id).single();
      if(data){await sb.from('procedures').update({helpful:(data.helpful||0)+1}).eq('id',p.id)}
    }catch(e){console.warn('Vote sync failed:',e)}
  }
  voted.push(id);store.set('votes',voted);
  toast('شكراً على تقييمك ❤️');viewDetail(id);
}

    <label>الرسوم</label><input id="ap-f" placeholder="مثال: 50 دينار (تحقق)">
    <label>الدائرة</label><input id="ap-o">
    <label>رقم الهاتف (اختياري)</label><input id="ap-ph">
    <label>رابط الخرائط (اختياري)</label><input id="ap-m" placeholder="https://maps.google.com/...">
    <label><input type="checkbox" id="ap-v" style="width:auto"> ✅ معلومات محققة ميدانياً</label>
    <button class="btn" onclick="addProc()">حفظ المعاملة</button>
    <p class="mut" style="margin-top:8px">التعديل: اكتب نفس اسم المعاملة والمدينة لتحديثها، أو اختر مدينة مختلفة لإضافة نسخة خاصة بتلك المدينة</p>
  </div>`;
  loadSuggList();
}
function login(){if($('#pass').value===ADMIN_PASS){sessionStorage.setItem('wa','1');viewAdmin()}else toast('كلمة السر غلط ❌')}
async function loadSuggList(){
  let list=[];
  if(sb){
    const {data,error}=await sb.from('suggestions').select('*').order('created_at',{ascending:false});
    list=error?store.get('sug',[]).slice().reverse():(data||[]);
  }else list=store.get('sug',[]).slice().reverse();
  $('#sugg-c').textContent='الاقتراحات: '+list.filter(x=>!x.done).length+' جديد';
  $('#sugg-list').innerHTML='<h3>💬 الاقتراحات الواردة</h3>'+(list.length?`<table><tr><th>المعاملة</th><th>الملاحظة</th><th>الاسم</th><th></th></tr>${list.map(x=>`<tr style="${x.done?'opacity:.45':''}"><td>${esc(x.procedure_title||'عام')}</td><td>${esc(x.message)}</td><td>${esc(x.name||'—')}</td><td><button class="btn sm alt" onclick="suggDone('${esc(String(x.id))}')">تم</button> <button class="btn sm alt" onclick="suggDel('${esc(String(x.id))}')">حذف</button></td></tr>`).join('')}</table>`:'<p class="mut">لا اقتراحات بعد</p>');
}
async function seedBtn(){
  if(!sb){toast('فعّل Supabase أولاً (SB_URL و SB_KEY)');return}
  let n=0;
  for(const raw of SEED){
    const p=normalizeProc(raw);
    const {data}=await sb.from('procedures').select('id').eq('title',p.t).eq('city',p.city).limit(1);
    if(data&&data.length)continue;
    const {error}=await sb.from('procedures').insert({title:p.t,category:p.c,city:p.city,docs:p.d,steps:p.s,fees:p.f,office:p.o,phone:p.ph,map_link:p.m,verified:p.verified,helpful:0});
    if(!error)n++;
  }
  toast(n?`تم رفع ${n} معاملة ✅`:'البيانات موجودة أصلاً — لا شيء جديد');
  boot();
}
function exportJson(){
  const blob=new Blob([JSON.stringify(DATA,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='procedures.json';a.click();
  toast('تم تنزيل النسخة الاحتياطية ⬇️');
}
async function addProc(){
  const t=$('#ap-t').value.trim();if(!t){toast('اكتب اسم المعاملة');return}
  const city=$('#ap-city').value.trim()||'طرابلس';
  const docs=$('#ap-d').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const steps=$('#ap-s').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const fees=$('#ap-f').value.trim();
  const office=$('#ap-o').value.trim();
  const phone=$('#ap-ph').value.trim();
  const map_link=$('#ap-m').value.trim();
  const verified=$('#ap-v').checked;
  const verified_at=verified?new Date().toISOString().slice(0,10):null;

  const dbItem={title:t,category:$('#ap-c').value,city,docs,steps,fees,office,phone,map_link,verified,verified_at};
  const localItem=normalizeProc({...dbItem,helpful:0});

  if(sb){
    const {data}=await sb.from('procedures').select('id').eq('title',t).eq('city',city).limit(1);
    if(data&&data.length){const {error}=await sb.from('procedures').update(dbItem).eq('id',data[0].id);if(error){toast('خطأ في التحديث');return}toast('تم تحديث المعاملة ✅')}
    else{const {error}=await sb.from('procedures').insert({...dbItem,helpful:0});if(error){toast('خطأ في الحفظ');return}toast('تمت الإضافة ✅')}
    boot();
  }else{
    const i=DATA.findIndex(p=>p.t===t&&p.city===city);
    if(i>-1)DATA[i]={...DATA[i],...localItem,id:DATA[i].id};else DATA.unshift({id:'x'+Date.now(),...localItem});
    toast('حُفظت محلياً (وضع تجريبي) — فعّل Supabase للحفظ الدائم');
    renderList();
  }
}
async function suggDone(id){
  if(sb){await sb.from('suggestions').update({done:true}).eq('id',id)}
  else{const l=store.get('sug',[]);const x=l.find(y=>String(y.id)===String(id));if(x)x.done=true;store.set('sug',l)}
  loadSuggList();toast('تمت الإشارة ✅');
}
async function suggDel(id){
  if(sb){await sb.from('suggestions').delete().eq('id',id)}
  else{store.set('sug',store.get('sug',[]).filter(y=>String(y.id)!==String(id)))}
  loadSuggList();toast('حُذف');
}

boot();
</script>
</body>
</html>
